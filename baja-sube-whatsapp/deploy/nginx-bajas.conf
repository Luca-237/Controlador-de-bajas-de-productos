# nginx — panel de bajas en el Cloud Server de DonWeb.
# Copiar a /etc/nginx/sites-available/bajas-cindy, enlazar en sites-enabled y recargar nginx.
# Es un archivo NUEVO: no toca los sitios que ya sirve el servidor (tareas, odoo, tazkeo, bot actual).
# Después: certbot --nginx -d bajas-web.bagsstore.com.ar  (agrega el bloque 443 y la redirección a HTTPS solo).
#
# Si se elige otro subdominio, cambiarlo acá, en el registro A de Ferozo y en el comando de certbot.

server {
    listen 80;
    listen [::]:80;
    server_name bajas-web.bagsstore.com.ar;

    # El panel escucha solo en 127.0.0.1:3011 (PANEL_PORT del .env); desde afuera se entra por acá.
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;   # el panel marca la cookie de sesión como segura detrás de HTTPS
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    client_max_body_size 64k; # el panel no recibe archivos
}
